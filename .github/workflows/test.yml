name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test src/

  dummy-tests:
    name: Dummy Tests with Variable Timings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run dummy tests and generate JUnit report
        run: bun test tests/dummy/ --reporter=junit --reporter-outfile=junit-results.xml

      - name: Display test results
        run: cat junit-results.xml

      - name: Save timings with fairsplice
        run: bun run index.ts save --from junit-results.xml

      - name: Display saved timings
        run: cat .fairsplice-timings.json

      - name: Split tests for 2 workers
        run: |
          bun run index.ts split --pattern "tests/dummy/*.test.ts" --total 2 --out split-2.json
          echo "Split for 2 workers:"
          cat split-2.json

      - name: Split tests for 3 workers
        run: |
          bun run index.ts split --pattern "tests/dummy/*.test.ts" --total 3 --out split-3.json
          echo "Split for 3 workers:"
          cat split-3.json

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-results.xml
            .fairsplice-timings.json
            split-2.json
            split-3.json

  # Integration test: simulates real CI workflow with cached timings
  integration-prepare:
    name: Prepare Test Split
    runs-on: ubuntu-latest
    outputs:
      has-timings: ${{ steps.check-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Try to restore timings from cache (simulates real CI)
      - name: Restore timings cache
        id: check-cache
        uses: actions/cache@v4
        with:
          path: .fairsplice-timings.json
          key: fairsplice-timings-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            fairsplice-timings-${{ github.ref }}-
            fairsplice-timings-

      # If no cached timings, generate initial ones
      - name: Generate initial timings (first run only)
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          echo "No cached timings found, generating initial timings..."
          bun test tests/dummy/ --reporter=junit --reporter-outfile=junit-results.xml
          bun run index.ts save --from junit-results.xml
          echo "Initial timings:"
          cat .fairsplice-timings.json

      - name: Show cached timings
        if: steps.check-cache.outputs.cache-hit == 'true'
        run: |
          echo "Using cached timings:"
          cat .fairsplice-timings.json

      # Split tests for workers
      - name: Split tests for 3 workers
        run: |
          bun run index.ts split --pattern "tests/dummy/*.test.ts" --total 3 --out split.json
          echo "Test split:"
          cat split.json

      # Upload split file for workers to use
      - name: Upload split configuration
        uses: actions/upload-artifact@v4
        with:
          name: test-split
          path: split.json

  integration-worker:
    name: Worker ${{ matrix.worker }}
    needs: integration-prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Download the split configuration from prepare job
      - name: Download split configuration
        uses: actions/download-artifact@v4
        with:
          name: test-split

      - name: Show assigned tests for worker ${{ matrix.worker }}
        run: |
          echo "Worker ${{ matrix.worker }} assigned tests:"
          cat split.json | bun -e "
            const split = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const workerTests = split[${{ matrix.worker }}] || [];
            console.log('Files to run:', workerTests);
            console.log('Number of files:', workerTests.length);
          "

      # Run ONLY this worker's assigned tests
      - name: Run worker ${{ matrix.worker }} tests
        run: |
          TESTS=$(cat split.json | bun -e "
            const split = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const workerTests = split[${{ matrix.worker }}] || [];
            console.log(workerTests.join(' '));
          ")
          if [ -n "$TESTS" ]; then
            echo "Running ONLY these tests: $TESTS"
            bun test $TESTS --reporter=junit --reporter-outfile=junit-worker-${{ matrix.worker }}.xml
          else
            echo "No tests assigned to this worker"
          fi

      # Upload this worker's results
      - name: Upload worker results
        uses: actions/upload-artifact@v4
        with:
          name: junit-worker-${{ matrix.worker }}
          path: junit-worker-${{ matrix.worker }}.xml
          if-no-files-found: ignore

  # Collect results and update timings for next run
  integration-finalize:
    name: Finalize & Update Timings
    needs: integration-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Restore existing timings
      - name: Restore timings cache
        uses: actions/cache@v4
        with:
          path: .fairsplice-timings.json
          key: fairsplice-timings-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            fairsplice-timings-${{ github.ref }}-
            fairsplice-timings-

      # Download all worker results
      - name: Download worker 0 results
        uses: actions/download-artifact@v4
        with:
          name: junit-worker-0
          path: results/
        continue-on-error: true

      - name: Download worker 1 results
        uses: actions/download-artifact@v4
        with:
          name: junit-worker-1
          path: results/
        continue-on-error: true

      - name: Download worker 2 results
        uses: actions/download-artifact@v4
        with:
          name: junit-worker-2
          path: results/
        continue-on-error: true

      # Merge and save new timings
      - name: Save updated timings from all workers
        run: |
          echo "Worker result files:"
          ls -la results/ || echo "No results directory"

          for file in results/junit-worker-*.xml; do
            if [ -f "$file" ]; then
              echo "Saving timings from $file"
              bun run index.ts save --from "$file"
            fi
          done

          echo "Updated timings:"
          cat .fairsplice-timings.json || echo "No timings file"

      - name: Summary
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Timings have been updated and cached for the next run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current timings:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat .fairsplice-timings.json >> $GITHUB_STEP_SUMMARY || echo "{}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
